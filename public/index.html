<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Text Summarizer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">

            <div class="logo">
                <div class="logo-icon">AI</div>

                <div>
                    <h1>AI Text Summarizer</h1>
                    <p>Summarize long text instantly with AI</p>
                </div>
            </div>

        </header>


        <!-- Main Card -->
        <main class="main-card">

            <!-- Input Section -->
            <section class="input-section">

                <div class="section-header">

                    <div>
                        <h2>Enter your text</h2>
                        <p>
                            Paste a long article, paragraph, report or document.
                        </p>
                    </div>

                    <div class="word-counter">
                        <span id="inputWordCount">0</span> words
                    </div>

                </div>


                <!-- Textarea -->
                <textarea
                    id="textInput"
                    placeholder="Paste your text here..."
                    maxlength="100000"
                ></textarea>


                <!-- Upload -->
                <div class="upload-section">

                    <label for="fileInput" class="file-label">
                        📄 Upload .txt file
                    </label>

                    <input
                        type="file"
                        id="fileInput"
                        accept=".txt,text/plain"
                    >

                    <span id="fileName"></span>

                </div>


                <!-- Controls -->
                <div class="controls">

                    <div class="control-group">

                        <label for="summaryLength">
                            Summary Length
                        </label>

                        <select id="summaryLength">

                            <option value="short">
                                Short
                            </option>

                            <option value="medium" selected>
                                Medium
                            </option>

                            <option value="long">
                                Long
                            </option>

                        </select>

                    </div>


                    <button
                        id="summarizeBtn"
                        class="primary-button"
                    >
                        <span id="buttonText">
                            ✨ Generate Summary
                        </span>

                        <span
                            id="loader"
                            class="loader hidden"
                        ></span>

                    </button>

                </div>

            </section>


            <!-- Results -->
            <section
                id="resultSection"
                class="result-section hidden"
            >

                <div class="result-header">

                    <div>
                        <h2>AI Summary</h2>
                        <p>Your generated summary appears below.</p>
                    </div>

                    <div class="result-actions">

                        <button
                            id="copyBtn"
                            class="secondary-button"
                        >
                            📋 Copy
                        </button>

                        <button
                            id="downloadBtn"
                            class="secondary-button"
                        >
                            ⬇ Download
                        </button>

                    </div>

                </div>


                <!-- Statistics -->
                <div class="stats">

                    <div class="stat-card">

                        <span class="stat-label">
                            Original
                        </span>

                        <strong id="originalCount">
                            0
                        </strong>

                        <span>words</span>

                    </div>


                    <div class="stat-card">

                        <span class="stat-label">
                            Summary
                        </span>

                        <strong id="summaryCount">
                            0
                        </strong>

                        <span>words</span>

                    </div>


                    <div class="stat-card reduction-card">

                        <span class="stat-label">
                            Reduction
                        </span>

                        <strong id="reductionCount">
                            0%
                        </strong>

                    </div>

                </div>


                <!-- Summary -->
                <div class="summary-box">

                    <div id="summaryText"></div>

                </div>

            </section>


            <!-- Error -->
            <div
                id="errorMessage"
                class="error-message hidden"
            ></div>

        </main>


        <!-- Footer -->
        <footer>

            <p>
                AI Text Summarizer • Node.js + Express + OpenAI API
            </p>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
